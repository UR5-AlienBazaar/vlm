[pytest]
# This machine has ROS 2 on PYTHONPATH, and several ROS packages register
# themselves as pytest plugins. pytest autoloads them before it ever reaches
# these tests, and launch_testing then dies importing yaml, which is not in
# this venv. None of them have anything to do with a CAD model, so they are
# switched off here rather than asking anyone to remember
# `env -u PYTHONPATH pytest`.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_lint
    -p no:ament_xmllint
testpaths = test_fingertip.py
