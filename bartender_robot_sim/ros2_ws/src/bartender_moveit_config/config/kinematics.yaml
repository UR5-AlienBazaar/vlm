# One entry per planning group. Both arms are the same UR5e, so the solver
# and its settings are the same; they need separate entries because MoveIt
# looks these up by group name and a group with no entry silently has no IK
# at all (pose goals then fail with "No kinematics solver instantiated").
/**:
  ros__parameters:
    robot_description_kinematics:
      ur_manipulator:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.005
        kinematics_solver_attempts: 3
      b_ur_manipulator:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.005
        kinematics_solver_attempts: 3
